data:
  dataset: assist2009
  path: data/raw/skill_builder_data_corrected.csv
  csv_encoding: latin-1
  split_seed: 42
  train_ratio: 0.7
  val_ratio: 0.1
  min_interactions: 5
  max_seq_len: 200
  chunk_protocol: window_aligned
  oof_folds: 5
stat:
  window_size: 5
  prior_alpha: 10.0
  user_alpha: 2.0
  has_real_timestamp: false
  has_real_resp_time: true
model:
  hidden_dim: 64
  num_heads: 4
  num_layers: 2
  dropout: 0.2
train:
  seeds: [42, 2025, 2026]
  epochs: 30
  patience: 5
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  device: auto
  cpu_threads: 4
experiment:
  output_dir: outputs/assist2009-final
  engine: cpp
  feature_threads: 4
  benchmark_sizes: [50000, 200000, 1000000]
  benchmark_threads: [1, 2, 4, 8]
  benchmark_repeats: 3
